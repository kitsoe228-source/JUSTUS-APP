name: Build JustUs Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # သင့်ရဲ့ build လုပ်မယ့် command တွေကို ဒီအောက်မှာ ဆက်ထည့်ပါ
      # ဥပမာ - run: npm run build

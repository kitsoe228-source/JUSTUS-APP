name: Android debug APK

# Run manually from GitHub (works from the GitHub iPhone app or Safari):
# Actions -> "Android debug APK" -> Run workflow. The APK is attached to the run
# as a downloadable artifact.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Published JustUs URL (leave empty to use the JUSTUS_APP_URL repository variable)"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAP_SERVER_URL: ${{ inputs.app_url || vars.JUSTUS_APP_URL }}
      # AdMob App ID is public (not a secret). Empty -> Google's official test ID.
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check app URL
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then
            echo "::error::Set the JUSTUS_APP_URL repository variable (Settings -> Secrets and variables -> Actions -> Variables) or pass app_url."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/android/configure.mjs

      - name: Generate icon and splash
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#FFF0F5' --splashBackgroundColor '#FFF0F5'

      - name: Sync web shell and plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JustUs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
